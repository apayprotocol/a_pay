<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Pay Monetized Express Service</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0f19; color: #f3f4f6; margin: 0; padding: 40px; display: flex; justify-content: center; }
    .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 32px; max-width: 540px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
    h1 { font-size: 22px; margin-top: 0; color: #fff; }
    p { color: #9ca3af; line-height: 1.5; font-size: 14px; }
    .badge { display: inline-block; background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 9999px; padding: 4px 10px; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    .btn { display: inline-block; background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; margin-top: 16px; transition: background 0.2s; }
    .btn:hover { background: #1d4ed8; }
    code { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-size: 13px; color: #38bdf8; }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">A-PAY PROTOCOL HTTP 402</span>
    <h1>Monetized Express AI Agent Endpoint</h1>
    <p>This service exposes <code>/api/agent</code>, protected by the universal A-Pay payment protocol on Base Layer 2.</p>
    <p>Autonomous AI agents can query this API and auto-settle micropayments in <strong>USDC</strong> or <strong>$APAY</strong> tokens via EIP-712 cryptographic signatures.</p>
    <button class="btn" onclick="testQuery()">Test Gated Endpoint (HTTP 402)</button>
    <pre id="output" style="margin-top: 20px; background: #030712; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; color: #a5f3fc; display: none;"></pre>
  </div>

  <!-- A-Pay Standalone Checkout Widget -->
  <script src="https://apayprotocol.org/v1.js"></script>
  <script>
    async function testQuery() {
      const out = document.getElementById('output');
      out.style.display = 'block';
      out.textContent = 'Probing /api/agent...';
      try {
        const res = await fetch('/api/agent?q=market-summary');
        const data = await res.json();
        out.textContent = `HTTP Status: ${res.status}\n\n` + JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
