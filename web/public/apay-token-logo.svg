<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' width='256' height='256'>
  <defs>
    <radialGradient id='coreGlow' cx='50%' cy='50%' r='50%'>
      <stop offset='0%' stop-color='#0ea5e9' stop-opacity='0.4'/>
      <stop offset='100%' stop-color='#0284c7' stop-opacity='0'/>
    </radialGradient>
    <linearGradient id='outerRing' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8'/>
      <stop offset='50%' stop-color='#2563eb'/>
      <stop offset='100%' stop-color='#6366f1'/>
    </linearGradient>
    <linearGradient id='coinBody' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='50%' stop-color='#020617'/>
      <stop offset='100%' stop-color='#0a0f1d'/>
    </linearGradient>
    <linearGradient id='symbolGrad' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8'/>
      <stop offset='50%' stop-color='#ffffff'/>
      <stop offset='100%' stop-color='#0284c7'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='6' result='blur'/>
      <feComposite in='SourceGraphic' in2='blur' operator='over'/>
    </filter>
  </defs>

  <!-- Background Circle (Dark Titanium) -->
  <circle cx='128' cy='128' r='120' fill='url(#coinBody)' stroke='url(#outerRing)' stroke-width='6'/>
  
  <!-- Subtle Internal Tech Radial Glow -->
  <circle cx='128' cy='128' r='100' fill='url(#coreGlow)'/>
  
  <!-- Inner Dashed Ring -->
  <circle cx='128' cy='128' r='104' fill='none' stroke='#0284c7' stroke-width='1.5' stroke-dasharray='6 4' opacity='0.6'/>

  <!-- High-Tech 'A' Emblem with Core Reactor Bolt -->
  <g filter='url(#glow)'>
    <!-- Left Leg -->
    <polygon points='128,42 108,82 82,142 54,204 84,204 102,158 128,158' fill='url(#symbolGrad)'/>
    <!-- Right Leg -->
    <polygon points='128,42 148,82 174,142 202,204 172,204 154,158 128,158' fill='url(#symbolGrad)'/>
    <!-- Inner Cyber Crossbar & Hex Reactor -->
    <polygon points='114,142 142,142 136,128 120,128' fill='#ffffff'/>
    <!-- Electric Quantum Lightning Pulse -->
    <polygon points='134,80 118,136 136,136 122,188 152,126 134,126' fill='#00f0ff' opacity='0.95'/>
  </g>
</svg>