<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <defs>
    <radialGradient id="xGlow" cx="75%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0052FF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0052FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E2438" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1E2438" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1E2438" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Deep Obsidian Space -->
  <rect width="1500" height="500" fill="#07080B"/>
  <rect width="1500" height="500" fill="url(#xGlow)"/>
  
  <!-- Subtle High-Tech Blueprint Grid -->
  <path d="M0,125 L1500,125 M0,250 L1500,250 M0,375 L1500,375" stroke="url(#lineFade)" stroke-width="1"/>
  <path d="M375,0 L375,500 M750,0 L750,500 M1125,0 L1125,500" stroke="url(#lineFade)" stroke-width="1"/>
  
  <!-- Right Side: Big Tech Emblem Watermark -->
  <g transform="translate(1180, 250) scale(0.9)">
    <rect x="-256" y="-256" width="512" height="512" rx="112" fill="#0A0D15" stroke="#191F30" stroke-width="2"/>
    <path d="M-115,130 L-25,-120 C-15,-150 15,-150 25,-120 L55,-35 L10,-35 L-6,-85 L-70,105 L-115,130 Z" fill="#0052FF"/>
    <path d="M115,130 L25,-120 C18,-140 0,-140 -5,-125 L-25,-65 L20,-65 L60,50 L-40,50 C-60,50 -75,35 -75,15 C-75,-5 -60,-20 -40,-20 L-10,-20 L-2,-50 L-40,-50 C-75,-50 -105,-20 -105,15 C-105,50 -75,80 -40,80 L70,80 L85,130 Z" fill="#FFFFFF"/>
  </g>
  
  <!-- Left/Center Typography -->
  <g transform="translate(120, 160)">
    <!-- Base Ecosystem Badge -->
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#0C1328" stroke="#0052FF" stroke-width="1.5"/>
    <circle cx="18" cy="16" r="5" fill="#0052FF"/>
    <text x="32" y="21" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0052FF" letter-spacing="1.5">BUILT ON BASE L2</text>
    
    <!-- Title -->
    <text x="0" y="88" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" letter-spacing="-2">A-Pay Protocol</text>
    
    <!-- Headline -->
    <text x="0" y="136" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500" fill="#94A3B8">The Universal HTTP 402 Micropayment &amp; Economic Layer for AI Agents</text>
    
    <!-- Technical Specs -->
    <g transform="translate(0, 185)">
      <text x="0" y="0" font-family="monospace" font-size="15" font-weight="600" fill="#38BDF8">⚡ Sub-15ms Settle</text>
      <text x="200" y="0" font-family="monospace" font-size="15" font-weight="600" fill="#38BDF8">🤖 Native MCP</text>
      <text x="370" y="0" font-family="monospace" font-size="15" font-weight="600" fill="#38BDF8">🔒 Non-Custodial Escrow</text>
      <text x="600" y="0" font-family="monospace" font-size="15" font-weight="600" fill="#38BDF8">🌐 EIP-712 Session Keys</text>
    </g>
    
    <!-- Canonical Address Footer -->
    <text x="0" y="240" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="600" fill="#64748B">apayprotocol.org  •  apayprotocol.base.eth  •  github.com/apayprotocol</text>
  </g>
