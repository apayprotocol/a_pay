# A-Pay Protocol — Multi-Platform Reels Cloud Scheduler & Codebase Integrity
# Runs on GitLab Cloud Shared Runners (100% Free & 24/7 Autopilot)
#
# NOTE: Automated social publishing is currently PAUSED (`ENABLE_SOCIAL_AUTOPUBLISH: "false"`).
# To re-enable later without editing this file:
#   1. Refresh META_USER_TOKEN in GitLab CI/CD Variables (Settings -> CI/CD -> Variables)
#   2. Set GitLab CI/CD Variable ENABLE_SOCIAL_AUTOPUBLISH="true" (or pass it on manual web trigger)
#   3. Re-activate the Pipeline Schedule in GitLab UI (Build -> Pipeline schedules)

variables:
  ENABLE_SOCIAL_AUTOPUBLISH: "false"

workflow:
  rules:
    - if: '$ENABLE_SOCIAL_AUTOPUBLISH == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$ENABLE_SOCIAL_AUTOPUBLISH == "true" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
    - when: never

stages:
  - test
  - publish

# Manual web trigger security check (Takes ~2s, guarantees non-empty green pipeline when run manually)
audit_security:
  stage: test
  image: python:3.11-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
  script:
    - python3 scripts/scan_secrets.py

# Runs on GitLab Schedule or manual Web trigger to dispatch reels across social platforms (when ENABLE_SOCIAL_AUTOPUBLISH=true)
publish_reels_cloud:
  stage: publish
  image: python:3.11-slim
  rules:
    - if: '$ENABLE_SOCIAL_AUTOPUBLISH == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$ENABLE_SOCIAL_AUTOPUBLISH == "true" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update && apt-get install -y ffmpeg curl git
    - git config --global user.name "A-Pay CI Bot"
    - git config --global user.email "bot@apayprotocol.org"
  script:
    - python3 scripts/reels_scheduler_daemon.py --dispatch-next
  after_script:
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN:-$CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add scripts/scheduled_reels_ledger.json
    - |
      if git diff --cached --quiet; then
        echo "No ledger changes to push."
      else
        git pull --rebase origin ${CI_COMMIT_BRANCH} || true
        git commit -m "chore(social): update scheduled reels ledger [skip ci]" || true
        git push origin HEAD:${CI_COMMIT_BRANCH} -o ci.skip || true
      fi

# Runs on GitLab Schedule or manual Web trigger to dispatch single image posts across social platforms (when ENABLE_SOCIAL_AUTOPUBLISH=true)
publish_single_posts_cloud:
  stage: publish
  image: python:3.11-slim
  rules:
    - if: '$ENABLE_SOCIAL_AUTOPUBLISH == "true" && $CI_PIPELINE_SOURCE == "schedule"'
    - if: '$ENABLE_SOCIAL_AUTOPUBLISH == "true" && $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"'
  before_script:
    - apt-get update && apt-get install -y curl git
    - git config --global user.name "A-Pay CI Bot"
    - git config --global user.email "bot@apayprotocol.org"
  script:
    - python3 scripts/single_image_scheduler_daemon.py --check-due
  after_script:
    - git remote set-url origin "https://oauth2:${GITLAB_PUSH_TOKEN:-$CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - git add scripts/single_image_posts_ledger.json
    - |
      if git diff --cached --quiet; then
        echo "No single image ledger changes to push."
      else
        git pull --rebase origin ${CI_COMMIT_BRANCH} || true
        git commit -m "chore(social): update scheduled single image posts ledger [skip ci]" || true
        git push origin HEAD:${CI_COMMIT_BRANCH} -o ci.skip || true
      fi

