[project]
name = "apay"
version = "0.1.8"
description = "Universal HTTP 402 Micropayment Protocol & CLI for Autonomous AI Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
authors = [
    { name = "A-Pay Protocol Core Team", email = "contact@apayprotocol.org" }
]
keywords = [
    "http-402",
    "micropayments",
    "ai-agents",
    "autonomous-agents",
    "base-l2",
    "usdc",
    "paywall",
    "m2m-economy"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
    "Topic :: Internet :: WWW/HTTP",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "eth-account>=0.11.0",
    "eth-abi>=5.0.0",
    "eth-hash>=0.7.0",
    "click>=8.1.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.urls]
Homepage = "https://apayprotocol.org"
Documentation = "https://apayprotocol.org"
Repository = "https://github.com/apayprotocol/a_pay"

[project.scripts]
apay = "apay.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = [
    "src/apay",
    "README.md",
    "pyproject.toml",
    "ARCHITECTURE.md",
    "spec",
]

[tool.hatch.build.targets.wheel]
packages = ["src/apay"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["BLE001", "B008", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

